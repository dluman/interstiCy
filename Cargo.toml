[package]
name = "intersticy"
version = "0.2.5"
edition = "2021"
authors = ["Douglas Luman <douglas.luman@example.com>"]
description = "Fast Rust implementation of spaCy tokenization"
license = "MIT"
repository = "https://github.com/dougluman/interstiCy"

[lib]
name = "intersticy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
fancy-regex = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
